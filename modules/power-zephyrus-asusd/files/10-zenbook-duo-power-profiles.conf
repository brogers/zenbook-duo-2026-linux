# zenbook-duo-2026-linux (power-zephyrus-asusd): power-profiles-daemon owns the power
# profile (Omarchy restores the one picked for AC or battery), and it sets the CPU
# energy performance preference (EPP) for it. asusd by default switches the platform
# profile on every plug and unplug and rewrites the EPP after every profile change,
# so the two race. Turn those three asusd settings off whenever it starts; asusd
# saves them in /etc/asusd/asusd.ron. Same as omacom/omarchy#15667.
[Service]
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform ChangePlatformProfileOnAc b false
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform ChangePlatformProfileOnBattery b false
ExecStartPost=-/usr/bin/busctl --system set-property xyz.ljones.Asusd /xyz/ljones xyz.ljones.Platform PlatformProfileLinkedEpp b false
