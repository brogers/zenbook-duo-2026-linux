PACKAGE_NAME="zenbook-duo-cs35l56"
PACKAGE_VERSION="7.2.11.1"
# Only 7.2.11 needs it: it took the machine-driver half of an upstream pair
# without this codec half, which is queued for 7.2.12.
BUILD_EXCLUSIVE_KERNEL="^7\.2\.11([^0-9]|$)"
PATCH[0]="0001-ASoC-cs35l56-Add-DAI-for-SDCA-OT25-stream.patch"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/sound/soc/codecs $(grep -q CONFIG_CC_IS_CLANG=y ${kernel_source_dir}/.config && echo LLVM=1) modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/sound/soc/codecs clean"
BUILT_MODULE_NAME[0]="snd-soc-cs35l56"
BUILT_MODULE_LOCATION[0]="sound/soc/codecs/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="snd-soc-cs35l56-sdw"
BUILT_MODULE_LOCATION[1]="sound/soc/codecs/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
