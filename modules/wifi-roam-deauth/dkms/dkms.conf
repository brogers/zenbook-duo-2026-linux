PACKAGE_NAME="zenbook-duo-mac80211"
PACKAGE_VERSION="1.1"
# build.sh fetches this kernel's own net/mac80211 sources (a few MB, sparse git
# clone), applies patches/ and builds mac80211.ko out of tree. If anything fails
# the stock mac80211 stays in use.
BUILD_EXCLUSIVE_KERNEL="^7\."
MAKE[0]="bash ./build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf src"
BUILT_MODULE_NAME[0]="mac80211"
BUILT_MODULE_LOCATION[0]="src/net/mac80211/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
