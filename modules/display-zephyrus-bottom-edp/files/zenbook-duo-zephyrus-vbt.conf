# zenbook-duo-2026-linux (display-zephyrus-bottom-edp): the edited VBT for
# xe.vbt_firmware=zenbook-duo/zephyrus-vbt-tc1-edp.bin, needed when xe loads.
FILES+=(/usr/lib/firmware/zenbook-duo/zephyrus-vbt-tc1-edp.bin)

# No NVIDIA in the initramfs (nvidia.conf adds it): loaded there, before xe, it leaves xe's
# panels black in hybrid mode (GPU MUX 1) until the dGPU sleeps, the LUKS prompt included.
# It loads from the root filesystem instead; in dGPU mode the firmware framebuffer shows the
# LUKS prompt on the top panel until then.
_zenbook_duo_modules=()
for _zenbook_duo_m in "${MODULES[@]}"; do
	[[ $_zenbook_duo_m == nvidia* ]] || _zenbook_duo_modules+=("$_zenbook_duo_m")
done
MODULES=("${_zenbook_duo_modules[@]}")
unset _zenbook_duo_modules _zenbook_duo_m
